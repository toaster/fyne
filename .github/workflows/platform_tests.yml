name: Platform Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  platform_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.14, 1.17]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runner: xvfb-run
          - os: windows-latest
            tags: no_glfw
          - go-version: 1.14
            tags: no_bench
          - os: windows-latest
            go-version: 1.14
            tags: no_glfw,no_bench

    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - uses: WillAbides/setup-go-faster@v1.7.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Get dependencies
      run: >-
        sudo apt-get update &&
        sudo apt-get install
        bc
        gcc
        libegl1-mesa-dev
        libgl1-mesa-dev
        libgles2-mesa-dev
        libwayland-dev
        libx11-dev
        libxkbcommon-dev
        xorg-dev
        xvfb
      if: ${{ runner.os == 'Linux' }}

    - name: Patch GLFW
      run: patch -p 1 < .github/workflows/glfw_macos_vm.patch
      if: ${{ runner.os == 'macOS' }}

    - name: Tests
      run: ${{ matrix.runner }} go test "-test.benchtime" 10ms -tags "${{ matrix.tags }}" ./...

    - name: Wayland Tests
      run: go test -tags ci,wayland ./...
      if: ${{ runner.os == 'Linux' }}

    - name: Update coverage
      run: |
        GO111MODULE=off go get github.com/mattn/goveralls
        set -e
        go test -tags ci -covermode=atomic -coverprofile=coverage.out ./...
        coverage=`go tool cover -func coverage.out | grep total | tr -s '\t' | cut -f 3 | grep -o '[^%]*'`
        if (( $(echo "$coverage < 63" | bc) )); then echo "Test coverage lowered"; exit 1; fi
      if: ${{ runner.os == 'Linux' }}

    - name: Update PR Coverage
      uses: shogo82148/actions-goveralls@v1
      with:
        path-to-profile: coverage.out
      if: ${{ runner.os == 'Linux' && matrix.go-version == '1.17' }}

    - name: Build WebAssembly binary
      env:
        GOOS: js
        GOARCH: wasm
      working-directory: cmd/fyne_demo
      run: go build
      if: ${{ matrix.go-version == '1.17' }}

    - name: Build GopherJS binary
      working-directory: cmd/fyne_demo
      run: |
        go install github.com/gopherjs/gopherjs@latest
        gopherjs build
      if: ${{ matrix.go-version == '1.17' && runner.os == 'Linux' }}
